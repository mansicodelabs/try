<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAMI — Frames</title>
<style>
:root{
  --bg:#ffffff; --ink:#1c1a17; --line:#e9e6df; --paper:#ffffff;
  --accent:#a3673e;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{max-width:100%; overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font-family:inherit}

header{
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 32px;
}
.wordmark{font-size:20px; font-weight:700; letter-spacing:0.08em; color:var(--ink)}
nav.links{display:flex; gap:28px; font-size:14px; color:var(--ink)}

.hero{position:relative; width:100%; height:68vh; min-height:420px; overflow:hidden; background:#ffffff}
.marquee{display:flex; width:max-content; height:100%; align-items:center; animation:slide 42s linear infinite}
.hero:hover .marquee{animation-play-state:paused}
@keyframes slide{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
.slide{height:100%; flex:none; display:flex; align-items:center; justify-content:center; padding:0 34px}
.slide img{height:54%; width:auto; max-width:none}
@media (prefers-reduced-motion:reduce){
  .marquee{animation:none}
}

main{max-width:1180px; margin:0 auto; padding:64px 32px 120px}
.collection-head{margin-bottom:36px}
.collection-head h1{font-size:28px; font-weight:600; letter-spacing:-0.01em}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line)}
@media (max-width:860px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .grid{grid-template-columns:1fr} }

.card{background:var(--paper); padding:22px 22px 22px; display:block; cursor:pointer; transition:background .25s ease}
.card:hover{background:#fff}
.slider{position:relative; overflow:hidden; touch-action:pan-y; background:#fff}
.card-imgs{height:210px; cursor:ew-resize}
.pair{display:flex; height:100%; width:200%; transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.pair img{flex:0 0 50%; width:50%; max-width:none; height:100%; object-fit:contain; pointer-events:none; user-select:none; background:#fff}
.card:hover .card-imgs:not(.show-front) .pair,
.slider.show-angle .pair{transform:translateX(-50%)}
.slider.show-front .pair{transform:translateX(0)}
.view-tag{
  position:absolute; left:10px; bottom:10px; z-index:2;
  font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:#6b665e; background:rgba(255,255,255,.86); padding:4px 8px;
}
.tag-angle{opacity:0}
.card:hover .card-imgs:not(.show-front) .tag-front,
.slider.show-angle .tag-front{opacity:0}
.card:hover .card-imgs:not(.show-front) .tag-angle,
.slider.show-angle .tag-angle{opacity:1}
.card-name{margin-top:16px; font-size:15px; font-weight:600}
.card-meta{margin-top:3px; font-size:13px; color:#6b665e}
.card-price{margin-top:4px; font-size:14px; color:#6b665e}

.detail{display:none; max-width:1000px; margin:0 auto; padding:120px 32px 100px}
.detail.active{display:block}
.back{display:inline-block; font-size:13px; color:#6b665e; margin-bottom:28px}
.detail-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:56px; align-items:start}
@media (max-width:760px){ .detail-grid{grid-template-columns:1fr; gap:28px} }
.viewer{height:min(68vh, 620px); cursor:ew-resize}
.viewer-ui{display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:12px}
.arrows{display:flex; gap:8px}
.arrows button, .switch button{
  background:#fff; border:1px solid var(--line); color:var(--ink);
  padding:8px 12px; font-size:13px; cursor:pointer;
}
.arrows button:hover, .switch button:hover{border-color:#c9c3b8}
.switch{display:flex}
.switch button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.viewer-hint{font-size:12px; color:#9a958b}
.detail-info h2{font-size:26px; font-weight:600; margin-bottom:6px}
.detail-note{font-size:14px; color:#6b665e; margin-bottom:8px}
.detail-price{font-size:16px; color:#6b665e; margin-bottom:26px}
.option{border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:18px 0; margin-bottom:26px}
.option label{display:flex; align-items:flex-start; gap:12px; cursor:pointer; font-size:14px; line-height:1.5}
.option input{margin-top:3px}
.rx-fields{display:none; margin-top:16px; grid-template-columns:1fr 1fr; gap:12px}
.rx-fields.show{display:grid}
.rx-fields input{width:100%; padding:9px 10px; border:1px solid var(--line); font-size:13px; background:#fff}
.rx-fields input::placeholder{color:#a49f95}
.total-row{display:flex; justify-content:space-between; align-items:center; font-size:15px; margin-bottom:22px}
.total-row strong{font-size:19px}
.add-btn{width:100%; padding:15px; background:var(--ink); color:#fff; border:none; font-size:14px; font-weight:600; cursor:pointer; letter-spacing:.02em}
.add-btn:hover{background:var(--accent)}
.confirm{margin-top:14px; font-size:13px; color:#6b665e; display:none}

footer{border-top:1px solid var(--line); padding:32px; text-align:center; font-size:13px}
footer p{color:#9a958b}

@media (hover:none){
  .card:hover .card-imgs:not(.show-angle) .pair{transform:none}
  .card:hover .card-imgs:not(.show-angle) .tag-front{opacity:1}
  .card:hover .card-imgs:not(.show-angle) .tag-angle{opacity:0}
}

@media (max-width:640px){
  header{
    padding:14px 16px;
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
    background:#fff;
  }
  .hero{height:34vh; min-height:210px; margin-top:52px}
  .slide{padding:0 16px}
  .slide img{height:auto; max-height:72%; width:auto; max-width:84vw}
  main{padding:32px 16px 80px}
  .collection-head{margin-bottom:20px}
  .collection-head h1{font-size:24px}
  .card{padding:16px}
  .card-imgs{height:200px}
  .detail{
    padding:84px 16px 80px;
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
  }
  .detail-info h2{font-size:22px}
  .viewer{height:220px; min-height:0; max-height:none}
  .arrows button, .switch button{min-height:44px; padding:10px 16px; font-size:15px}
  .add-btn{min-height:48px; font-size:16px}
  .rx-fields{grid-template-columns:1fr}
  .rx-fields input{font-size:16px; padding:12px 10px}
  footer{padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">TAMI</div>
  <nav class="links"><a href="#" onclick="showList();return false;">Shop</a></nav>
</header>

<div id="listView">
  <div class="hero">
    <div class="marquee" id="marquee"></div>
  </div>

  <main>
    <div class="collection-head">
      <h1>The collection</h1>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="detail" id="detailView">
  <a href="#" class="back" onclick="showList();return false;">&larr; Back to collection</a>
  <div class="detail-grid" id="detailContent"></div>
</div>

<footer><p>TAMI — frames &amp; lenses, together.</p></footer>

<script>
const FRAME_PRICE = 80;
const LENS_PRICE = 80;

const products = [
  { id:1,  name:"Navy rectangle",     note:"Green temples",            front:"images/dsc03137.jpg", angle:"images/dsc03138.jpg" },
  { id:2,  name:"Black rectangle",    note:"Classic",                  front:"images/dsc03139.jpg", angle:"images/dsc03142.jpg" },
  { id:3,  name:"Forest rectangle",   note:"Green",                    front:"images/dsc03143.jpg", angle:"images/dsc03144.jpg" },
  { id:4,  name:"Crystal geometric",  note:"Clear",                    front:"images/dsc03145.jpg", angle:"images/dsc03147.jpg" },
  { id:5,  name:"Amber fade",         note:"Black to amber",           front:"images/dsc03148.jpg", angle:"images/dsc03149.jpg" },
  { id:6,  name:"Clear rectangle",    note:"Crystal",                  front:"images/dsc03150.jpg", angle:"images/dsc03151.jpg" },
  { id:7,  name:"Tortoiseshell",      note:"Classic",                  front:"images/dsc03152.jpg", angle:"images/dsc03153.jpg" },
  { id:8,  name:"Bold black",         note:"Silver corners",           front:"images/dsc03154.jpg", angle:"images/dsc03155.jpg" },
  { id:9,  name:"Smoke rectangle",    note:"Translucent grey",         front:"images/dsc03156.jpg", angle:"images/dsc03157.jpg" },
  { id:10, name:"Tortoise temple",    note:"Black front",              front:"images/dsc03158.jpg", angle:"images/dsc03159.jpg" },
  { id:11, name:"Blue temple",        note:"Black front",              front:"images/dsc03160.jpg", angle:"images/dsc03162.jpg" },
  { id:12, name:"Crystal square",     note:"Clear",                    front:"images/dsc03163.jpg", angle:"images/dsc03164.jpg" },
  { id:13, name:"Tortoise geometric", note:"Tortoiseshell",            front:"images/dsc03165.jpg", angle:"images/dsc03166.jpg" },
  { id:14, name:"Rounded black",      note:"Thick frame",              front:"images/dsc03171.jpg", angle:"images/dsc03172.jpg" },
  { id:15, name:"Slim black",         note:"Silver corners",           front:"images/dsc03173.jpg", angle:"images/dsc03174.jpg" },
];

const marquee = document.getElementById("marquee");
const heroItems = [...products, ...products];
marquee.innerHTML = heroItems.map(p => `
  <div class="slide"><img src="${p.front}" alt="${p.name}"></div>
`).join("");

const grid = document.getElementById("grid");
grid.innerHTML = products.map(p => `
  <a class="card" href="#p=${p.id}">
    <div class="slider card-imgs" data-slider>
      <div class="pair">
        <img src="${p.front}" alt="${p.name}, front">
        <img src="${p.angle}" alt="${p.name}, angle">
      </div>
      <div class="view-tag tag-front">Front</div>
      <div class="view-tag tag-angle">Angle</div>
    </div>
    <div class="card-name">${p.name}</div>
    <div class="card-meta">${p.note}</div>
    <div class="card-price">$${FRAME_PRICE} CAD</div>
  </a>
`).join("");

function bindSlider(el){
  const pair = el.querySelector(".pair");
  let startX = 0, origin = 0, moved = false, active = false;

  function shown(){
    if(el.classList.contains("show-front")) return 0;
    if(el.classList.contains("show-angle")) return 1;
    if(el.closest(".card") && el.closest(".card").matches(":hover")) return 1;
    return 0;
  }
  function setIndex(i){
    el.classList.toggle("show-angle", i === 1);
    el.classList.toggle("show-front", i === 0 && el.closest(".card") && el.matches(":hover"));
    if(i === 1) el.classList.remove("show-front");
    if(i === 0 && !(el.closest(".card") && el.matches(":hover"))) el.classList.remove("show-front");
    pair.style.transform = "";
    const scope = el.parentElement || el;
    scope.querySelectorAll(".switch [data-go]").forEach(btn => {
      btn.classList.toggle("on", Number(btn.dataset.go) === i);
    });
  }

  el.addEventListener("pointerdown", (e) => {
    if(e.target.closest("button")) return;
    active = true; moved = false; startX = e.clientX;
    origin = shown() === 1 ? -el.clientWidth : 0;
    el.dataset.dragging = "1";
    pair.style.transition = "none";
    pair.style.transform = `translateX(${origin}px)`;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if(!active) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 8) moved = true;
    const x = Math.max(-el.clientWidth, Math.min(0, origin + dx));
    pair.style.transform = `translateX(${x}px)`;
  });
  function end(e){
    if(!active) return;
    active = false;
    el.dataset.dragging = "";
    pair.style.transition = "";
    const dx = (e.clientX ?? startX) - startX;
    if(moved){
      setIndex(origin + dx < -el.clientWidth / 2 ? 1 : 0);
      const card = el.closest("a.card");
      if(card) card.dataset.suppress = "1";
    } else {
      pair.style.transform = "";
    }
  }
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  const card = el.closest(".card");
  if(card){
    card.addEventListener("mouseleave", () => {
      if(el.dataset.dragging) return;
      el.classList.remove("show-angle", "show-front");
      pair.style.transform = "";
    });
    card.addEventListener("click", (e) => {
      if(card.dataset.suppress === "1"){
        e.preventDefault();
        card.dataset.suppress = "";
      }
    });
  }
  const scope = el.parentElement || el;
  scope.querySelectorAll("[data-go]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      setIndex(Number(btn.dataset.go));
    });
  });
}

document.querySelectorAll("[data-slider]").forEach(bindSlider);

function renderDetail(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  document.getElementById("detailContent").innerHTML = `
    <div>
      <div class="slider viewer" data-slider id="viewer">
        <div class="pair">
          <img src="${p.front}" alt="${p.name}, front">
          <img src="${p.angle}" alt="${p.name}, angle">
        </div>
        <div class="view-tag tag-front">Front</div>
        <div class="view-tag tag-angle">Angle</div>
      </div>
      <div class="viewer-ui">
        <div class="switch">
          <button type="button" data-go="0" class="on">Front</button>
          <button type="button" data-go="1">Angle</button>
        </div>
        <div class="arrows">
          <button type="button" data-go="0" aria-label="Show front">&#8592;</button>
          <button type="button" data-go="1" aria-label="Show angle">&#8594;</button>
        </div>
      </div>
      <p class="viewer-hint" style="margin-top:8px">Drag the photo, or use the buttons, to slide between the two views.</p>
    </div>
    <div class="detail-info">
      <h2>${p.name}</h2>
      <div class="detail-note">${p.note}</div>
      <div class="detail-price">$${FRAME_PRICE} CAD</div>
      <div class="option">
        <label>
          <input type="checkbox" id="rxCheck" onchange="toggleRx()">
          Add prescription lenses — +$${LENS_PRICE} CAD
        </label>
        <div class="rx-fields" id="rxFields">
          <input placeholder="Sphere (OD)"><input placeholder="Sphere (OS)">
          <input placeholder="Cylinder (OD)"><input placeholder="Cylinder (OS)">
          <input placeholder="Axis (OD)"><input placeholder="Axis (OS)">
          <input placeholder="Pupillary distance" style="grid-column:1/3">
        </div>
      </div>
      <div class="total-row"><span>Total</span><strong id="totalPrice">$${FRAME_PRICE} CAD</strong></div>
      <button class="add-btn" onclick="addToBag('${p.name.replace(/'/g, "")}')">Add to bag</button>
      <div class="confirm" id="confirmMsg">Added ${p.name} to your bag.</div>
    </div>
  `;
  bindSlider(document.getElementById("viewer"));
}

function toggleRx(){
  const checked = document.getElementById("rxCheck").checked;
  document.getElementById("rxFields").classList.toggle("show", checked);
  const total = FRAME_PRICE + (checked ? LENS_PRICE : 0);
  document.getElementById("totalPrice").textContent = `$${total} CAD`;
}

function addToBag(){
  document.getElementById("confirmMsg").style.display = "block";
}

function showList(){
  history.replaceState(null, "", "#");
  document.getElementById("listView").style.display = "block";
  document.getElementById("detailView").classList.remove("active");
  window.scrollTo(0,0);
}

function showDetail(id){
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").classList.add("active");
  renderDetail(id);
  window.scrollTo(0,0);
}

function routeFromHash(){
  const m = location.hash.match(/#p=(\d+)/);
  if(m) showDetail(parseInt(m[1],10));
  else showList();
}
window.addEventListener("hashchange", routeFromHash);
routeFromHash();
</script>
</body>
</html>
